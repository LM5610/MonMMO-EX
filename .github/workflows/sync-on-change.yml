name: Near-real-time sync from upstream

on:
  schedule:
    - cron: '*/5 * * * *'   # 每 5 分钟运行一次
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout origin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add and fetch upstream
        run: |
          git remote add upstream https://github.com/charlieduzstuf/MonMMO-EX.git || true
          git fetch --tags upstream

      - name: Check for upstream changes
        id: check
        run: |
          UPSTREAM_COMMIT=$(git rev-parse --verify upstream/master)
          ORIGIN_COMMIT=$(git rev-parse --verify origin/master)
          echo "upstream=$UPSTREAM_COMMIT" >> $GITHUB_OUTPUT
          echo "origin=$ORIGIN_COMMIT" >> $GITHUB_OUTPUT
          if [ "$UPSTREAM_COMMIT" = "$ORIGIN_COMMIT" ]; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream -> origin and push
        if: steps.check.outputs.no_changes == 'false'
        run: |
          git checkout master || git checkout -b master
          # 尝试快进合并；若不能快进则做合并提交
          if git merge --ff-only upstream/master; then
            echo "Fast-forwarded to upstream"
          else
            git merge --no-edit upstream/master
          fi
          git push origin master
